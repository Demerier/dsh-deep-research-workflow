name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run offline regression
        run: node test/run.mjs
      - name: Check host entry loads
        run: node -e "import('./lib/host.js').then(m => { if (typeof m.apply !== 'function') process.exit(1); console.log('host entry ok') })"
